services:
  # ==============================================================================
  # 1. Nginx Proxy Manager (NPM) - 리버스 프록시 및 SSL 인증서 자동 발급 관리자
  # ==============================================================================
  npm:
    image: 'jc21/nginx-proxy-manager:latest'
    container_name: nginx-proxy-manager
    restart: unless-stopped
    ports:
      - '80:80'     # 공인 HTTP 포트 (웹 접속 & Let's Encrypt 인증용)
      - '443:443'   # 공인 HTTPS 포트 (보안 암호화 웹 접속)
      - '81:81'     # NPM 관리 콘솔 (초기: admin@example.com / changeme)
    environment:
      DISABLE_IPV6: 'true'
    volumes:
      - ./data/npm:/data
      - ./data/letsencrypt:/etc/letsencrypt
    networks:
      - app-network

  # ==============================================================================
  # 2. 민성이의 가계부 프론트엔드 웹 서비스 (가계부 자체 호스팅 컨테이너)
  # ==============================================================================
  ledger-web:
    image: nginx:alpine
    container_name: ledger-web-app
    restart: unless-stopped
    volumes:
      - ../:/usr/share/nginx/html:ro
    networks:
      - app-network
    # 외부 포트는 노출하지 않고, npm을 통해 서브도메인(예: ledger.mydomain.com)으로 연결

networks:
  app-network:
    external: true
